[install]
# Block packages published less than 5 days ago from being resolved.
# Defends against same-day supply chain attacks (e.g. CVE-2026-45321 / TanStack, May 2026).
minimumReleaseAge = 432000 # 5 days in seconds

# Per-package bypass — only add a name here if a fresh release fixes a known
# CVE we are exposed to and we accept the supply-chain trade-off.
#   - Claude Agent SDK 0.3.233 (2026-08-14) is explicitly selected for current
#     provider work. Its exact platform companions must resolve with it.
# Review and remove these exclusions after 2026-08-19.
minimumReleaseAgeExcludes = [
  "@anthropic-ai/claude-agent-sdk",
  "@anthropic-ai/claude-agent-sdk-darwin-arm64",
  "@anthropic-ai/claude-agent-sdk-darwin-x64",
  "@anthropic-ai/claude-agent-sdk-linux-arm64",
  "@anthropic-ai/claude-agent-sdk-linux-arm64-musl",
  "@anthropic-ai/claude-agent-sdk-linux-x64",
  "@anthropic-ai/claude-agent-sdk-linux-x64-musl",
  "@anthropic-ai/claude-agent-sdk-win32-arm64",
  "@anthropic-ai/claude-agent-sdk-win32-x64",
]
